<!DOCTYPE html>
<html>
<head>
    <title>Battle Game</title>
</head>
<body>

<h2>Register Player</h2>

<input id="username" placeholder="Username">
<input id="level" placeholder="Level">
<input id="gold" placeholder="Gold">

<button onclick="register()">Register</button>

<h2>Leaderboard</h2>
<button onclick="loadLeaderboard()">Load Leaderboard</button>

<pre id="leaderboard"></pre>

<script>

function register(){
    fetch("http://localhost:7071/api/registerplayer",{
        method:"POST",
        headers:{
            "Content-Type":"application/json"
        },
        body: JSON.stringify({
            username: document.getElementById("username").value,
            level: parseInt(document.getElementById("level").value),
            gold: parseInt(document.getElementById("gold").value)
        })
    })
    .then(res => res.text())
    .then(data => alert(data));
}

function loadLeaderboard(){
    fetch("http://localhost:7071/api/getleaderboard")
    .then(res => res.text())
    .then(data => {
        document.getElementById("leaderboard").innerText = data;
    });
}

</script>

</body>
</html>
